# Self-host MoneyUnify Switch in production on your own server with Docker:
# the app (web, queue worker, scheduler), Postgres, and Caddy in front for
# automatic HTTPS. Configure .env.production first (see .env.production.example),
# then run:
#
#   docker compose --env-file .env.production -f compose.prod.yaml up -d --build
#
# Guide: prezet/content/docker-production.md
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: true
    environment:
      # Fail fast instead of starting with a missing key or password.
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env.production}"
      APP_URL: "${APP_URL:?Set APP_URL in .env.production}"
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: moneyunify
      DB_USERNAME: moneyunify
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.production}"
      SEED_DEMO_DATA: "false"
    volumes:
      - app-storage:/var/www/html/storage/app
    # Reached only through Caddy; not published on the host.
    expose:
      - "10000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneyunify
      POSTGRES_USER: moneyunify
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.production}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyunify -d moneyunify"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    # Gets and renews a Let's Encrypt certificate for APP_DOMAIN automatically.
    command: caddy reverse-proxy --from "${APP_DOMAIN:?Set APP_DOMAIN in .env.production}" --to app:10000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-storage:
  db-data:
  caddy-data:
  caddy-config:
